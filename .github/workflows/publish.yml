name: Publish to npm

on:
  release:
    types: [created]

env:
  # Run JS-based actions (checkout, setup-node) on Node 24 to silence the
  # Node 20 deprecation warning until v5 of those actions ships.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm publish --provenance --access public
